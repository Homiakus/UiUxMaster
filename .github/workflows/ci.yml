name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chrome-headless-shell || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chromium-family browser is installed on the runner"
            exit 1
          fi
          echo "UIUX_CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: FastCDP Chromium integration
        env:
          UIUX_FASTCDP_INTEGRATION: '1'
        run: go test ./internal/runtime/fastcdp -run '^TestResidentRuntimeIntegration$' -count=1 -v

      - name: Create benchmark artifacts directory
        run: mkdir -p ./build/benchmarks

      - name: FastCDP warm benchmark
        run: go run ./cmd/uiuxcdpbench -iterations 10 -warmup 2 | tee ./build/benchmarks/uiuxcdpbench.json

      - name: FastCDP comparative driver benchmark
        run: go run ./cmd/uiuxcdpbench -comparative > ./build/benchmarks/driver_comparison.json

      - name: Impact scaling benchmark
        shell: bash
        run: go test -bench=BenchmarkResolver -benchmem -run='^$' ./internal/impact > ./build/benchmarks/impact_scaling.txt

      - name: Scope stage benchmark
        run: go run ./cmd/uiuxscopebench -iterations 200 -warmup 20 | tee ./build/benchmarks/scope_stages.json

      - name: Benchmark smoke
        run: go run ./cmd/uiuxbench -nodes 100 -iterations 50 -warmup 10 -project-components 30 -project-iterations 3 -project-warmup 1 -wggo-iterations 3 -wggo-warmup 1 | tee ./build/benchmarks/uiuxbench.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: ./build/benchmarks/
          retention-days: 30
          if-no-files-found: error
