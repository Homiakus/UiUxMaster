name: axiom-control

on:
  push:
    branches: [main]
    paths:
      - 'control/axiom/**'
      - 'internal/runtime/fastcdp/**'
      - 'internal/evidence/**'
      - 'internal/evidenceplan/**'
      - 'internal/engine/**'
      - 'internal/verifier/**'
      - '.github/workflows/axiom-control.yml'
  pull_request:
    paths:
      - 'control/axiom/**'
      - 'internal/runtime/fastcdp/**'
      - 'internal/evidence/**'
      - 'internal/evidenceplan/**'
      - 'internal/engine/**'
      - 'internal/verifier/**'
      - '.github/workflows/axiom-control.yml'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control/axiom
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: control/axiom/go.sum

      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify Axiom isolation
        run: |
          if grep -q 'github.com/Homiakus/axiom' ../../go.mod; then
            echo '::error::Axiom leaked into root FastPath go.mod'
            exit 1
          fi
          test "$(go list -m -f '{{.Version}}' github.com/Homiakus/axiom)" = 'v0.0.0-20260902054936-44cea54c5cea'

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chrome-headless-shell || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chromium-family browser is installed on the runner"
            exit 1
          fi
          echo "UIUX_CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Axiom FastCDP end-to-end
        env:
          UIUX_AXIOM_FASTCDP_INTEGRATION: '1'
        run: go test ./uiuxadapter -run '^TestAxiomFastCDPEndToEndIntegration$' -count=1 -v
