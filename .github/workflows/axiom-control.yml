name: axiom-control

on:
  push:
    branches: [main]
    paths:
      - 'control/axiom/**'
      - '.github/workflows/axiom-control.yml'
  pull_request:
    paths:
      - 'control/axiom/**'
      - '.github/workflows/axiom-control.yml'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control/axiom
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: control/axiom/go.mod

      - name: Canonicalize nested module
        run: go mod tidy

      - name: Upload canonical module lock
        uses: actions/upload-artifact@v4
        with:
          name: axiom-control-module-lock
          path: control/axiom/go.sum
          if-no-files-found: error

      - name: Verify Axiom isolation
        run: |
          if grep -q 'github.com/Homiakus/axiom' ../../go.mod; then
            echo '::error::Axiom leaked into root FastPath go.mod'
            exit 1
          fi
          go list -m github.com/Homiakus/axiom

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Vet
        run: go vet ./...
